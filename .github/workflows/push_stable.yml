name: Push to stable
on:
  push:
    branches: [stable]
  workflow_dispatch:
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
  build:
    name: Build artifacts (${{ matrix.os }})
    needs: [release-please]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install .[dev,e2e] prek
      - name: Build Flet web app (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash ./build_static.sh \
            --base-url /${{ github.event.repository.name }}/
      - name: Archive and Upload Web Release (Linux only)
        if: runner.os == 'Linux'
        run: |
          tar -czf amplifyp-web.tar.gz -C dist .
      - name: Upload Web Artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-web
          path: amplifyp-web.tar.gz
      - name: Build Flet Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libmpv-dev mpv wget
          python scripts/gen_git_sha.py
          flet build linux src -o build/linux --project AmplifyP --yes
          mv build/linux build/AmplifyP
          tar -czf amplifyp-linux.tar.gz -C build AmplifyP

          # Create .desktop file for AppImage integration
          cat << 'EOF' | sed 's/^ *//' > build/AmplifyP/AmplifyP.desktop
          [Desktop Entry]
          Type=Application
          Name=AmplifyP
          Comment=Simulate Polymerase Chain Reaction (PCR) and predict DNA amplification products.
          Exec=AmplifyP %U
          Icon=AmplifyP
          Categories=Science;Education;
          Terminal=false
          EOF

          # Copy icon
          cp src/assets/images/icon.png build/AmplifyP/AmplifyP.png
          cp src/assets/images/icon.png build/AmplifyP/.DirIcon

          # Create AppRun script
          cat << 'EOF' | sed 's/^ *//' > build/AmplifyP/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/AmplifyP" "$@"
          EOF
          chmod +x build/AmplifyP/AppRun

          # Package as AppImage using extracted appimagetool to bypass FUSE requirements
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          export ARCH=x86_64
          ./squashfs-root/AppRun build/AmplifyP amplifyp-linux.AppImage
      - name: Build Flet macOS binary
        if: runner.os == 'macOS'
        run: |
          python scripts/gen_git_sha.py
          flet build macos src -o build/macos --project AmplifyP --yes
          mv build/macos build/AmplifyP
          ln -s /Applications build/AmplifyP/Applications
          hdiutil create \
            -volname "AmplifyP" \
            -srcfolder build/AmplifyP \
            -ov \
            -format UDZO \
            amplifyp-macos.dmg
      - name: Build Flet Windows binary
        if: runner.os == 'Windows'
        run: |
          python scripts/gen_git_sha.py
          flet build windows src -o build/windows --project AmplifyP --yes
          mv build/windows build/AmplifyP
          python -c "
          import shutil
          shutil.make_archive('amplifyp-windows', 'zip', 'build', 'AmplifyP')
          "
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          $tag_name = "${{ needs.release-please.outputs.tag_name }}"
          if ([string]::IsNullOrEmpty($tag_name)) {
            $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          } else {
            $version = $tag_name.Substring(1)
          }
          iscc .github/workflows/amplifyp.iss /DVersion=$version /O.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-${{ runner.os }}
          path: |
            amplifyp-linux.tar.gz
            amplifyp-linux.AppImage
            amplifyp-macos.dmg
            amplifyp-windows.zip
            amplifyp-windows-setup-*.exe
          if-no-files-found: ignore
  upload-assets:
    name: Upload Assets to GitHub Release
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: amplifyp-*
          merge-multiple: true
      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            amplifyp-linux.tar.gz \
            amplifyp-linux.AppImage \
            amplifyp-macos.dmg \
            amplifyp-windows.zip \
            amplifyp-windows-setup-*.exe \
            amplifyp-web.tar.gz
  deploy:
    name: Deploy to GitHub Pages
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
