name: Push to stable
on:
  push:
    branches: [stable]
  workflow_dispatch:
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
  build:
    name: Build artifacts (${{ matrix.os }})
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install .[dev,e2e] prek
      - name: Build Flet web app (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash ./build_static.sh --base-url /${{ github.event.repository.name }}/
      - name: Archive and Upload Web Release (Linux only)
        if: runner.os == 'Linux'
        run: |
          tar -czf amplifyp-web.tar.gz -C dist .
      - name: Upload Web Artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-web
          path: amplifyp-web.tar.gz
      - name: Build Flet Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libmpv-dev mpv
          python scripts/gen_git_sha.py
          flet build linux src -o build/linux --project AmplifyP --yes
          mv build/linux build/AmplifyP
          tar -czf amplifyp-linux.tar.gz -C build AmplifyP
      - name: Build Flet macOS binary
        if: runner.os == 'macOS'
        run: |
          python scripts/gen_git_sha.py
          flet build macos src -o build/macos --project AmplifyP --yes
          mv build/macos build/AmplifyP
          ln -s /Applications build/AmplifyP/Applications
          hdiutil create \
            -volname "AmplifyP" \
            -srcfolder build/AmplifyP \
            -ov \
            -format UDZO \
            amplifyp-macos.dmg
      - name: Build Flet Windows binary
        if: runner.os == 'Windows'
        run: |
          python scripts/gen_git_sha.py
          flet build windows src -o build/windows --project AmplifyP --yes
          mv build/windows build/AmplifyP
          python -c "
          import shutil
          shutil.make_archive('amplifyp-windows', 'zip', 'build', 'AmplifyP')
          "
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-${{ runner.os }}
          path: |
            amplifyp-linux.tar.gz
            amplifyp-macos.dmg
            amplifyp-windows.zip
          if-no-files-found: ignore
  upload-assets:
    name: Upload Assets to GitHub Release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: amplifyp-*
          merge-multiple: true
      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            amplifyp-linux.tar.gz \
            amplifyp-macos.dmg \
            amplifyp-windows.zip \
            amplifyp-web.tar.gz
  deploy:
    name: Deploy to GitHub Pages
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
