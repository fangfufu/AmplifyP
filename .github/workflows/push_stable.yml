name: Push to stable
on:
  push:
    branches: [stable]
  workflow_dispatch:
jobs:
  build:
    name: Build artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install .[dev,e2e] pre-commit
      - name: Build Flet web app (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash ./build_static.sh --base-url /${{ github.event.repository.name }}/
      - name: Archive and Upload Web Release (Linux only)
        if: runner.os == 'Linux'
        run: |
          tar -czf amplifyp-web.tar.gz -C dist .
      - name: Upload Web Artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-web
          path: amplifyp-web.tar.gz
      - name: Build Flet Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libmpv-dev mpv
          python scripts/gen_git_sha.py
          flet build linux src -o build/linux --project AmplifyP --yes
          mv build/linux build/AmplifyP
          tar -czf amplifyp-linux.tar.gz -C build AmplifyP
      - name: Build Flet macOS binary
        if: runner.os == 'macOS'
        run: |
          python scripts/gen_git_sha.py
          flet build macos src -o build/macos --project AmplifyP --yes
          mv build/macos build/AmplifyP
          ln -s /Applications build/AmplifyP/Applications
          hdiutil create \
            -volname "AmplifyP" \
            -srcfolder build/AmplifyP \
            -ov \
            -format UDZO \
            amplifyp-macos.dmg
      - name: Build Flet Windows binary
        if: runner.os == 'Windows'
        run: |
          python scripts/gen_git_sha.py
          flet build windows src -o build/windows --project AmplifyP --yes
          mv build/windows build/AmplifyP
          python -c "
          import shutil
          shutil.make_archive('amplifyp-windows', 'zip', 'build', 'AmplifyP')
          "
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-${{ runner.os }}
          path: |
            amplifyp-linux.tar.gz
            amplifyp-macos.dmg
            amplifyp-windows.zip
          if-no-files-found: ignore
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Get version and short SHA
        id: info
        shell: bash
        run: |
          VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: amplifyp-*
          merge-multiple: true
      - name: Create Pre-release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          tag_name: >-
            ${{ steps.info.outputs.version }}-${{ steps.info.outputs.sha }}
          name: >-
            Release ${{ steps.info.outputs.version }} (${{ steps.info.outputs.sha }})
          files: |
            amplifyp-linux.tar.gz
            amplifyp-macos.dmg
            amplifyp-windows.zip
            amplifyp-web.tar.gz
  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
