name: Push to stable
on:
  push:
    branches: [stable]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'PyPI publish target'
        required: true
        type: choice
        default: 'testpypi'
        options:
          - 'testpypi'
          - 'pypi'
          - 'skip'
      build_binaries:
        description: 'Build OS binaries (Linux/macOS/Windows)?'
        required: true
        type: boolean
        default: false
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
  build-web:
    name: Build web app
    needs: [release-please]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.build_binaries == true))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set version environment variable
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: python
        run: |
          import os
          import tomllib

          tag_name = os.getenv("TAG_NAME", "")
          if tag_name:
              version = tag_name.lstrip("v")
          else:
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]

          github_env = os.getenv("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"VERSION={version}\n")
      - name: Install dependencies
        run: |
          pip install .[dev]
      - name: Build Flet web app
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          bash ./build_web.sh \
            --base-url "/${REPO_NAME}/"
      - name: Archive web release
        run: |
          tar -czf "amplifyp-${VERSION}-web.tar.gz" -C dist .
      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-web
          path: amplifyp-*-web.tar.gz
          overwrite: true
      - name: Upload web asset to release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload --clobber "${TAG_NAME}" \
            "amplifyp-${VERSION}-web.tar.gz"
  build:
    name: Build artifacts (${{ matrix.os }})
    needs: [release-please]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.build_binaries == true))
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set version environment variable
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: python
        run: |
          import os
          import tomllib

          tag_name = os.getenv("TAG_NAME", "")
          if tag_name:
              version = tag_name.lstrip("v")
          else:
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]

          github_env = os.getenv("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"VERSION={version}\n")
      - name: Install dependencies
        run: |
          pip install .[dev,e2e] prek
      - name: Build Flet Linux binary
        if: runner.os == 'Linux'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARCH="$(uname -m)"
          PATTERN="amplifyp-*-${ARCH}.AppImage.zsync"
          UPDATE_INFO="gh-releases-zsync|${REPO_OWNER}|${REPO_NAME}|latest"
          export UPDATE_INFORMATION="${UPDATE_INFO}|${PATTERN}"
          ./build_linux.sh --install-deps
          APPIMAGE="amplifyp-${VERSION}-${ARCH}.AppImage"
          APPIMAGE_ZSYNC="${APPIMAGE}.zsync"
          if [[ -f "${APPIMAGE_ZSYNC}" ]]; then
            sed -i "s|^Filename: .*|Filename: ${APPIMAGE}|" "${APPIMAGE_ZSYNC}"
            sed -i "s|^URL: .*|URL: ${APPIMAGE}|" "${APPIMAGE_ZSYNC}"
          fi
      - name: Build Flet macOS binary
        if: runner.os == 'macOS'
        run: |
          python scripts/gen_git_sha.py
          flet build macos . -o build/macos --project AmplifyP --yes
          rm -f src/amplifyp/git_sha.py
          mv build/macos build/AmplifyP
          ln -s /Applications build/AmplifyP/Applications
          hdiutil create \
            -volname "AmplifyP" \
            -srcfolder build/AmplifyP \
            -ov \
            -format UDZO \
            "amplifyp-${VERSION}-macos.dmg"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y
      - name: Build Windows binary and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build_windows.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-${{ runner.os }}-${{ runner.arch }}
          path: |
            amplifyp-*-linux-*.tar.gz
            amplifyp-*.AppImage
            amplifyp-*.AppImage.zsync
            amplifyp-*-macos.dmg
            amplifyp-*-windows-*.zip
            amplifyp-*-windows-*-setup.exe
          if-no-files-found: ignore
          overwrite: true
      - name: Upload Linux assets to release
        if: |-
          needs.release-please.outputs.release_created == 'true' &&
          runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ARCH="$(uname -m)"
          gh release upload --clobber "${TAG_NAME}" \
            "amplifyp-${VERSION}-linux-${ARCH}.tar.gz" \
            "amplifyp-${VERSION}-${ARCH}.AppImage" \
            "amplifyp-${VERSION}-${ARCH}.AppImage.zsync"
      - name: Upload macOS assets to release
        if: |-
          needs.release-please.outputs.release_created == 'true' &&
          runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload --clobber "${TAG_NAME}" \
            "amplifyp-${VERSION}-macos.dmg"
      - name: Upload Windows assets to release
        if: |-
          needs.release-please.outputs.release_created == 'true' &&
          runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload --clobber "$env:TAG_NAME" `
            "amplifyp-$env:VERSION-windows-x86_64.zip" `
            "amplifyp-$env:VERSION-windows-x86_64-setup.exe"
  build-pypi-dist:
    name: Build PyPI distribution
    needs: [release-please]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_target != 'skip'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build
        run: pip install build
      - name: Generate Git SHA
        run: python scripts/gen_git_sha.py
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-dist
          path: dist/
          overwrite: true
      - name: Upload wheel to release
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload --clobber "${TAG_NAME}" dist/amplifyp-*.whl
  deploy:
    name: Deploy to GitHub Pages
    needs: [release-please, build-web]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-*-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: >-
            github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build-pypi-dist]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_target != 'skip'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_target == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-dist
          path: dist/
      - name: Publish to TestPyPI
        if: |-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: |-
          github.event_name == 'push' ||
          inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
