name: Push to stable
on:
  push:
    branches: [stable]
  workflow_dispatch:
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
  build:
    name: Build artifacts (${{ matrix.os }})
    needs: [release-please]
    if: |-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set version environment variable
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: python
        run: |
          import os
          import tomllib

          tag_name = os.getenv("TAG_NAME", "")
          if tag_name:
              version = tag_name.lstrip("v")
          else:
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]

          github_env = os.getenv("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"VERSION={version}\n")
      - name: Install dependencies
        run: |
          pip install .[dev,e2e] prek
      - name: Build Flet web app (Linux only)
        if: runner.os == 'Linux'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          bash ./build_web.sh \
            --base-url "/${REPO_NAME}/"
      - name: Archive and Upload Web Release (Linux only)
        if: runner.os == 'Linux'
        run: |
          tar -czf amplifyp-web.tar.gz -C dist .
      - name: Upload Web Artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-web
          path: amplifyp-web.tar.gz
      - name: Build Flet Linux binary
        if: runner.os == 'Linux'
        run: |
          ./build_linux.sh --install-deps
          mv amplifyp-linux.tar.gz amplifyp-linux-${VERSION}.tar.gz
          mv amplifyp-linux.AppImage amplifyp-linux-${VERSION}.AppImage
      - name: Build Flet macOS binary
        if: runner.os == 'macOS'
        run: |
          python scripts/gen_git_sha.py
          flet build macos src -o build/macos --project AmplifyP --yes
          mv build/macos build/AmplifyP
          ln -s /Applications build/AmplifyP/Applications
          hdiutil create \
            -volname "AmplifyP" \
            -srcfolder build/AmplifyP \
            -ov \
            -format UDZO \
            amplifyp-macos-${VERSION}.dmg
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y
      - name: Build Windows binary and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build_windows.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplifyp-${{ runner.os }}
          path: |
            amplifyp-linux-*.tar.gz
            amplifyp-linux-*.AppImage
            amplifyp-macos-*.dmg
            amplifyp-windows-*.zip
            amplifyp-windows-setup-*.exe
          if-no-files-found: ignore
  upload-assets:
    name: Upload Assets to GitHub Release
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: amplifyp-*
          merge-multiple: true
      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            amplifyp-linux-*.tar.gz \
            amplifyp-linux-*.AppImage \
            amplifyp-macos-*.dmg \
            amplifyp-windows-*.zip \
            amplifyp-windows-setup-*.exe \
            amplifyp-web.tar.gz
  deploy:
    name: Deploy to GitHub Pages
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
