name: Prek Auto-update Hooks
on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays at 00:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-update:
    name: Auto-update prek hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install prek
        run: |
          pip install prek
      - name: Run prek auto-update
        run: |
          prek auto-update
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update prek hooks"
          title: "chore: update prek hooks"
          body: |
            This PR automatically updates the versions of configured `prek` hooks in `prek.toml`.

            This pull request was automatically generated by the Prek Auto-update Hooks workflow.
          branch: prek-autoupdate
          delete-branch: true
