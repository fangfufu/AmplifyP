name: AmplifyP post-commit
on:
  pull_request:
    branches: [stable]
  push:
    branches: [dev, stable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install .[tests,e2e] pre-commit
      - name: Run pre-commit
        shell: bash
        run: |
          SKIP=pytest pre-commit run --all-files --show-diff-on-failure
      - name: Run unit tests
        shell: bash
        run: |
          pytest -v
      - name: Build Flet web app (Linux only)
        if: |
          runner.os == 'Linux' &&
          matrix.python-version == '3.13' &&
          !(github.event_name == 'push' && github.ref_name == 'dev')
        run: |
          bash ./build_static.sh \
            --base-url /${{ github.event.repository.name }}/
      - name: Archive and Upload Web Release
        if: |
          (github.event_name == 'push' && github.ref_name == 'stable' ||
          github.event_name == 'workflow_dispatch') &&
          runner.os == 'Linux' &&
          matrix.python-version == '3.13'
        run: |
          tar -czf amplifyp-web.tar.gz -C dist .
      - name: Upload Web Artifact
        if: |
          (github.event_name == 'push' && github.ref_name == 'stable' ||
          github.event_name == 'workflow_dispatch') &&
          runner.os == 'Linux' &&
          matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: amplifyp-web
          path: amplifyp-web.tar.gz
      - name: Display coverage report
        run: |
          coverage report -m
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
      - name: Run E2E tests
        if: |
          runner.os == 'Linux' &&
          matrix.python-version == '3.13' &&
          !(github.event_name == 'push' && github.ref_name == 'dev')
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tesseract-ocr libtesseract-dev
          playwright install --with-deps chromium
          xvfb-run -a pytest -v -m e2e
      - name: Build Flet Linux binary
        if: |
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref_name == 'stable' &&
          runner.os == 'Linux' &&
          matrix.python-version == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake llvm lld ninja-build pkg-config \
            libgtk-3-dev libsecret-1-0 libsecret-1-dev libunwind-dev \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libmpv-dev mpv
          flet build linux src --yes
          tar -czf amplifyp-linux.tar.gz -C build/linux .
      - name: Build Flet macOS binary
        if: |
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref_name == 'stable' &&
          runner.os == 'macOS' &&
          matrix.python-version == '3.13'
        run: |
          flet build macos src --yes
          python -c "
          import shutil
          shutil.make_archive('amplifyp-macos', 'zip', 'build/macos')
          "
      - name: Build Flet Windows binary
        if: |
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref_name == 'stable' &&
          runner.os == 'Windows' &&
          matrix.python-version == '3.13'
        run: |
          flet build windows src --yes
          python -c "
          import shutil
          shutil.make_archive('amplifyp-windows', 'zip', 'build/windows')
          "
      - name: Upload build artifact
        if: |
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref_name == 'stable' &&
          matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: amplifyp-${{ runner.os }}
          path: |
            amplifyp-linux.tar.gz
            amplifyp-macos.zip
            amplifyp-windows.zip
          if-no-files-found: ignore
  release:
    needs: [test]
    if: |
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref_name == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Get version and short SHA
        id: info
        shell: bash
        run: |
          VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: amplifyp-*
          merge-multiple: true
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: >-
            ${{ steps.info.outputs.version }}-${{ steps.info.outputs.sha }}
          name: >-
            Release ${{ steps.info.outputs.version }} (${{ steps.info.outputs.sha }})
          files: |
            amplifyp-linux.tar.gz
            amplifyp-macos.zip
            amplifyp-windows.zip
            amplifyp-web.tar.gz
  deploy:
    needs: test
    if: |
      always() &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' && github.ref_name == 'stable' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: amplifyp-web
      - name: Extract archive
        run: |
          mkdir dist
          tar -xzf amplifyp-web.tar.gz -C dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
